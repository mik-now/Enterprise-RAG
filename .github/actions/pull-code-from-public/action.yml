name: "Pull code from public PR"

inputs:
  Repository-name:
    description: 'Repository name'
    required: true
  PR-number:
    description: 'Pull request number'
    required: true

runs:
  using: "composite"
  steps:
  - name: Checkout Code
    uses: actions/checkout@v4
    with:
      path: repo

  - name: Merge code from public PR
    id: pull
    run: |
      cd repo
      git config --global user.email "actions@github.com"
      git config --global user.name "Github Actions"
      git remote add opea_rag https://github.com/${{ inputs.Repository-name }}
      git fetch opea_rag
      git checkout public_PR_${{ inputs.PR-number }} || git checkout -b public_PR_${{ inputs.PR-number }}
      git fetch opea_rag pull/{{ inputs.PR-number }}/head:external_pr_{{ inputs.PR-number }}
      git merge external_pr_{{ inputs.PR-number }} --no-commit --allow-unrelated-histories --strategy-option=theirs --squash
      git reset -- .github
      if [ -d ".github" ]; then
        cd .github
        git clean -fd
        cd ..
      fi
      git checkout -- .
      if [ -n "$(git status --porcelain)" ]; then
        echo "pull=true" >> "$GITHUB_OUTPUT"
        git add --all && git commit -m "Merge code from external PR No. ${{ inputs.PR-number }}" --signoff
        git push --set-upstream origin public_PR_${{ inputs.PR-number }}
      else
        echo "No changes to be commited";
      fi
    shell: bash

  - name: Install sudo
    run: apt update && apt -y install sudo
    shell: bash

  - name: Install Github CLI
    run: |
      (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
      && sudo mkdir -p -m 755 /etc/apt/keyrings \
      && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
      && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
      && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
      && sudo apt update \
      && sudo apt install gh -y
    shell: bash

  - name: Create PR
    if: ${{ steps.pull.outputs.pull == 'true' }}
    run: gh pr create --base main --head public_PR_${{ inputs.PR-number }} --title 'Public PR No. ${{ inputs.PR-number }}' --body 'PR No. ${{ inputs.PR-number }} from https://github.com/${{ inputs.Repository-name }}' || echo "PR already exists"
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}

  - name: Verify git diff
    run: |
      cd repo
      echo "git diff with .github/ excluded:"
      git diff external_pr_{{ inputs.PR-number }} --name-only -- ":(exclude).github/*"
      if [[ -z "$(git diff external_pr_{{ inputs.PR-number }} --name-only -- ":(exclude).github/*")" ]]; then
        exit 0;
      fi
    shell: bash
